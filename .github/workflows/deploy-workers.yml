# Deploy Cloudflare Workers
name: Deploy Workers

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'packages/**'
      - 'package.json'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

jobs:
  deploy-api-gateway:
    name: Deploy API Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy API Gateway and sync required secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.114.17"
          workingDirectory: services/api-gateway
          command: deploy
          secrets: |
            GEMINI_API_KEY
            GROQ_API_KEY
            NVIDIA_API_KEY
            OPENCODE_API_KEY
            OPENROUTER_API_KEY
            AI_ACCESS_TOKEN
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_ACCESS_TOKEN: ${{ secrets.JWT_SECRET }}

      - name: Verify production health
        run: curl --fail --retry 8 --retry-delay 5 --retry-all-errors https://api.seref-keser.workers.dev/health
