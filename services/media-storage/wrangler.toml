name = "otonom-media-storage"
main = "src/index.ts"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
CORS_ORIGIN = "https://serefkeser.github.io"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "otonom-media"
preview_bucket_name = "otonom-media-preview"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "your-rate-limit-kv-id"
preview_id = "your-rate-limit-kv-preview-id"

[build]
watch_dir = ["src"]

[env.preview]
name = "otonom-media-storage-preview"
vars = { ENVIRONMENT = "preview" }
