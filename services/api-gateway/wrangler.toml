name = "otonom-api-gateway"
main = "src/index.ts"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
CORS_ORIGIN = "https://serefkeser.github.io"
AI_TEXT_PROVIDER_ORDER = "groq,opencode,nvidia,gemini"
AI_VISION_PROVIDER_ORDER = "groq,nvidia,gemini"
GROQ_TEXT_MODEL = "openai/gpt-oss-120b"
GROQ_VISION_MODEL = "qwen/qwen3.6-27b"
NVIDIA_TEXT_MODEL = "nvidia/nemotron-3-nano-30b-a3b"
NVIDIA_VISION_MODEL = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
OPENCODE_TEXT_MODEL = "deepseek-v4-flash-free"
GEMINI_ANALYSIS_MODEL = "gemini-2.5-flash"
GEMINI_TTS_MODEL = "gemini-2.5-flash-preview-tts"
ALLOW_NVIDIA_TRIAL = "false"

[observability]
enabled = true

[build]
watch_dir = ["src"]

# Environment-specific overrides
[env.preview]
name = "otonom-api-gateway-preview"
vars = { ENVIRONMENT = "preview", CORS_ORIGIN = "https://serefkeser.github.io", AI_TEXT_PROVIDER_ORDER = "groq,opencode,nvidia,gemini", AI_VISION_PROVIDER_ORDER = "groq,nvidia,gemini", GROQ_TEXT_MODEL = "openai/gpt-oss-120b", GROQ_VISION_MODEL = "qwen/qwen3.6-27b", NVIDIA_TEXT_MODEL = "nvidia/nemotron-3-nano-30b-a3b", NVIDIA_VISION_MODEL = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning", OPENCODE_TEXT_MODEL = "deepseek-v4-flash-free", GEMINI_ANALYSIS_MODEL = "gemini-2.5-flash", GEMINI_TTS_MODEL = "gemini-2.5-flash-preview-tts", ALLOW_NVIDIA_TRIAL = "true" }

[env.development]
name = "otonom-api-gateway-dev"
vars = { ENVIRONMENT = "development", CORS_ORIGIN = "http://localhost:3000", AI_TEXT_PROVIDER_ORDER = "groq,opencode,nvidia,gemini", AI_VISION_PROVIDER_ORDER = "groq,nvidia,gemini", GROQ_TEXT_MODEL = "openai/gpt-oss-120b", GROQ_VISION_MODEL = "qwen/qwen3.6-27b", NVIDIA_TEXT_MODEL = "nvidia/nemotron-3-nano-30b-a3b", NVIDIA_VISION_MODEL = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning", OPENCODE_TEXT_MODEL = "deepseek-v4-flash-free", GEMINI_ANALYSIS_MODEL = "gemini-2.5-flash", GEMINI_TTS_MODEL = "gemini-2.5-flash-preview-tts", ALLOW_NVIDIA_TRIAL = "true" }
